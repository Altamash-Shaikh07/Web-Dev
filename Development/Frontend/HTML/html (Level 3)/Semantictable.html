<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html-Level 3</title>
</head>
<body>
    <table>
        <caption>Food Menu</caption>
        <!-- table header -->
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <!-- table body -->
        <tbody>
            <tr>
                <td>Pizza</td>
                <td>10</td>
            </tr>
             <tr>
                <td>Burger</td>
                <td>5</td>
            </tr>
            <tr>

            </tr>
        </tbody>
    </table>
</body>
</html>
