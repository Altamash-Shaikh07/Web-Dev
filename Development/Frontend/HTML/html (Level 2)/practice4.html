<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <!-- The hr tag is used to create a horizontal line, which can be used to separate content -->
    <p>Hello World.</p>
    <hr /><!-- A horizontal rule -->
    <p>It's a beautiful day!</p>
</body>
</html>
