<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Vs Block</title>
</head>
<body>
    <!-- Block Element -->
    <h1>Hello, World!</h1>
    <h1>Apna College.</h1>
    <!-- Block Element -->
     <p>hELLO, WORLD!</p>
    <p>APNA COLLEGE.</p>
    <!-- Inline Element -->
     <a href="www.google.com">Google</a>
     <a href="www.facebook.com">Facebook</a>
     <a href="www.youtube.com">YouTube</a> 
     <!-- Inline Element -->
    <img src="https://media.istockphoto.com/id/185284489/photo/orange.jpg?s=612x612&w=0&k=20&c=m4EXknC74i2aYWCbjxbzZ6EtRaJkdSJNtekh4m1PspE="/>
    <img src="https://thumbs.dreamstime.com/b/red-apple-isolated-clipping-path-19130134.jpg"/>
</body>
</html>
